# One service: builds the image from ./Dockerfile and runs the full test suite.
# `docker compose run turingos make run` boots the OS interactively instead;
# `docker compose run turingos make test-web` runs the Node tests over the wasm build.
services:
  turingos:
    build: .
    container_name: turingos
    working_dir: /workspace
    command: make test
    tty: true
    stdin_open: true
    volumes:
      - .:/workspace

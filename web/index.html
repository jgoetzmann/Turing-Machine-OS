      <h1>TuringOS</h1>
      <p>
        An operating system built out of a Turing machine's parts. The tape is a byte array, the head
        is an Intel 8080's program counter, and the finite control is a six-state kernel. One C99 core
        runs it as a native binary and, compiled to WebAssembly, in this page.
      </p>
      <p>
        The live machine needs JavaScript and WebAssembly. The source, the architecture notes and the
